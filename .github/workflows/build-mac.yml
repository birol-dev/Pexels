name: Build macOS Installer

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  release:
    types: [published]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Installer (.dmg)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install Dependencies
        run: npm ci

      - name: Pre-stage Electron Cache for electron-builder
        run: |
          mkdir -p ~/Library/Caches/electron
          cp ~/Library/Caches/electron/*/electron-v*.zip ~/Library/Caches/electron/ 2>/dev/null || true

      - name: Build and Package App
        run: npm run build:mac -- --publish never

      - name: Upload macOS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockFinder-AI-macOS
          path: |
            dist/stockfinder-ai-*.dmg
            dist/stockfinder-ai-*.zip
          if-no-files-found: error

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/stockfinder-ai-*.dmg
            dist/stockfinder-ai-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
