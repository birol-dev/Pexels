name: Build Windows Installer

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  release:
    types: [published]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install Dependencies
        run: npm ci

      - name: Pre-stage Electron Cache for electron-builder
        shell: pwsh
        run: |
          if (Test-Path "$env:LOCALAPPDATA\electron\Cache") {
            Get-ChildItem -Path "$env:LOCALAPPDATA\electron\Cache\*\electron-v*.zip" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$env:LOCALAPPDATA\electron\Cache\" -Force
            }
          }

      - name: Build and Package App
        run: npm run build:win -- --publish never

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockFinder-AI-Windows-Setup
          path: dist/stockfinder-ai-*-setup.exe
          if-no-files-found: error

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: dist/stockfinder-ai-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
