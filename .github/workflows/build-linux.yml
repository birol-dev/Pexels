name: Build Linux Packages

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Packages (.AppImage, .deb)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Cache electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install Dependencies
        run: npm ci

      - name: Pre-stage Electron Cache for electron-builder
        run: |
          mkdir -p ~/.cache/electron
          cp ~/.cache/electron/*/electron-v*.zip ~/.cache/electron/ 2>/dev/null || true

      # electron-builder names the release after package.json, not after the pushed tag.
      - name: Check Tag Matches package.json Version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # On a tag, electron-builder uploads the AppImage, the deb and latest-linux.yml to
      # the draft release for this version. Other builds stay local.
      - name: Build and Package App
        run: npm run build:linux -- --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StockFinder-AI-Linux
          path: |
            dist/stockfinder-ai-*.AppImage
            dist/stockfinder-ai-*.deb
          if-no-files-found: error
