appId: com.eact6.stockfinder-ai
productName: StockFinder AI

# --- Auto-Publish Configuration ---
publish:
  provider: github
  releaseType: draft

directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,PUBLISHING.md,project-reference.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{website,test,stitch_stockfinder_ai,docs}/**'
  - '!{.agents,.claude,.cursor,.github,test-results,playwright-report}/**'
  - '!{eval,eval-cache,eval-results,scripts,.wrangler}/**'
  - '!{skills-lock.json,postcss.config.js,.gitattributes,.editorconfig}'
  - '!{components.json,wrangler.jsonc}'
  - '!*.tsbuildinfo'
asarUnpack:
  - resources/**
win:
  executableName: stockfinder-ai
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # The zip has no target section of its own; without this it is named from productName
  # and misses the stockfinder-ai-* glob in build-mac.yml. The dmg keeps its own name below.
  artifactName: ${name}-${version}-mac.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: birol-dev
  category: Utility
deb:
  artifactName: ${name}-${version}.${ext}
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
